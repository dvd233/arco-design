name: Source-bound Slider browser regression

on:
  push:
    branches: [validation/slider-negative-marks]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slider-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-bound-browser:
    if: >-
      github.repository == 'dvd233/arco-design' &&
      github.repository_id == '1407419356' &&
      github.repository_owner_id == '111864431' &&
      github.ref == 'refs/heads/validation/slider-negative-marks' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      TZ: Asia/Singapore
      FORCE_COLOR: '0'
      GIT_TERMINAL_PROMPT: '0'
      HUSKY: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/bundle/work/playwright-browsers
    steps:
      - name: Check out the exact independent validation publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dvd233/arco-design
          ref: ${{ github.sha }}
          path: bundle
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Stop an unapproved draft before runtime or dependency installation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('bundle')
          manifest = json.loads((root / 'source-manifest.json').read_text())
          assert manifest['state'] == 'frozen-audited', 'Draft is not approved for execution'
          assert manifest['css']['state'] == 'audited-native-css', 'Native CSS contract is not approved'
          assert isinstance(manifest['runtime'], dict), 'Exact runtime policy is not frozen'
          assert (root / 'publication-manifest.json').is_file(), 'Final publication inventory is missing'
          assert (root / 'candidate.patch').is_file(), 'Approved original patch is missing'
          PY

      - name: Set up the exact harness runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.3'
          check-latest: false
          package-manager-cache: false

      - name: Verify the publication and retain the harness runtime location
        run: |
          set -euo pipefail
          cd bundle
          mkdir -p evidence/bootstrap
          node --input-type=module -e 'import { executionScope } from "./scripts/phase.mjs"; await executionScope();' 2>&1 | tee evidence/bootstrap/publication-gate.log
          printf 'HARNESS_NODE=%s\n' "$(readlink -f "$(command -v node)")" >> "$GITHUB_ENV"
          printf 'HARNESS_NPM_ENTRY=%s\n' "$(readlink -f "$(command -v npm)")" >> "$GITHUB_ENV"
          node --version > evidence/bootstrap/harness-node-version.txt
          sha256sum "$(readlink -f "$(command -v node)")" > evidence/bootstrap/harness-node-sha256.txt
          git rev-parse HEAD > evidence/bootstrap/validation-commit.txt
          cp source-manifest.json publication-manifest.json actions-lock.json package-lock.json css-source-audit.json candidate.patch evidence/bootstrap/
          cp toolchain/package-lock.json evidence/bootstrap/yarn-toolchain-package-lock.json
          cp .github/workflows/validate-slider-negative-marks-browser.yml evidence/bootstrap/workflow.yml

      - name: Install the two frozen helper dependency graphs
        run: |
          set -euo pipefail
          cd bundle
          "$HARNESS_NODE" "$HARNESS_NPM_ENTRY" ci --no-audit --no-fund 2>&1 | tee evidence/bootstrap/harness-install.log
          "$HARNESS_NODE" "$HARNESS_NPM_ENTRY" ci --prefix toolchain --ignore-scripts --no-audit --no-fund 2>&1 | tee evidence/bootstrap/yarn-toolchain-install.log
          "$HARNESS_NODE" --test tests/*.test.mjs 2>&1 | tee evidence/bootstrap/validator-tests.log
          cp evidence/synthetic-tests/pair-v2-counterexamples.json evidence/bootstrap/synthetic-pair-counterexamples.json
          cp evidence/synthetic-tests/phase-v2-counterexamples.json evidence/bootstrap/synthetic-phase-counterexamples.json

      - name: Set up the original source runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '16.20.2'
          check-latest: false
          package-manager-cache: false

      - name: Verify the original runtime before executing source commands
        run: |
          set -euo pipefail
          native_node="$(readlink -f "$(command -v node)")"
          test "$("$native_node" --version)" = 'v16.20.2'
          test "$(sha256sum "$native_node" | cut -d ' ' -f 1)" = '8440cffda5a21bf7cfda43d2c396f79777585a4c5e03ed2801fe226953a7aa11'
          printf 'NATIVE_NODE=%s\n' "$native_node" >> "$GITHUB_ENV"
          "$native_node" --version > bundle/evidence/bootstrap/native-node-version.txt
          sha256sum "$native_node" > bundle/evidence/bootstrap/native-node-sha256.txt

      - name: Materialize the exact pristine source baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dvd233/arco-design
          ref: c2b050d9c7ce94bebba94f616a0721344231caac
          path: bundle/work/baseline
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Materialize the exact candidate and baseline history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dvd233/arco-design
          ref: a1ea1670c162248348515ddfa14e445860bb3c22
          path: bundle/work/fixed
          persist-credentials: false
          fetch-depth: 3
          submodules: false
          lfs: false

      - name: Prepare original icons and CSS and build each harness sequentially
        run: |
          set -euo pipefail
          cd bundle
          for variant in baseline fixed; do
            "$HARNESS_NODE" scripts/prepare.mjs --source "work/$variant" --variant "$variant" --native-node "$NATIVE_NODE" --through css
            "$HARNESS_NODE" scripts/run-stage.mjs --stage build --source "work/$variant" --variant "$variant"
          done
          printf 'Both exact-source build-only gates completed.\n' > evidence/bootstrap/build-only-completed.txt

      - name: Install the locked official Chromium only after both builds pass
        run: |
          set -euo pipefail
          cd bundle
          test -s evidence/bootstrap/build-only-completed.txt
          "$HARNESS_NODE" node_modules/playwright-core/cli.js install --with-deps chromium 2>&1 | tee evidence/bootstrap/chromium-install.log
          "$HARNESS_NODE" --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("node_modules/playwright-core/package.json")); const b=JSON.parse(fs.readFileSync("node_modules/playwright-core/browsers.json")).browsers; if(p.version!=="1.56.1") throw Error("Playwright version mismatch"); for(const n of ["chromium","chromium-headless-shell"]){const x=b.find(y=>y.name===n);if(x?.revision!=="1194"||x?.browserVersion!=="141.0.7390.37")throw Error("Chromium package metadata mismatch");} console.log(JSON.stringify({playwright:p.version,browsers:b.filter(x=>["chromium","chromium-headless-shell"].includes(x.name))},null,2));' > evidence/bootstrap/chromium-package-metadata.json

      - name: Run identical sandboxed Chromium scenarios and capture real exits
        run: |
          set -euo pipefail
          cd bundle
          for variant in baseline fixed; do
            expected=0
            if [[ "$variant" == baseline ]]; then expected=1; fi
            set +e
            "$HARNESS_NODE" scripts/run-stage.mjs --stage browser --source "work/$variant" --variant "$variant"
            actual=$?
            set -e
            printf '%s\n' "$actual" > "evidence/$variant/workflow-browser.exit-code"
            test "$actual" = "$expected"
          done

      - name: Reverify the full current-source production chain and exact red/green pair
        run: |
          set -euo pipefail
          cd bundle
          "$HARNESS_NODE" scripts/verify-pair.mjs --baseline evidence/baseline --fixed evidence/fixed --out evidence/VERDICT.json 2>&1 | tee evidence/bootstrap/final-verification.log

      - name: Preserve exact evidence and failures without dependency trees or synthetic fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slider-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bundle/evidence/baseline/
            bundle/evidence/fixed/
            bundle/evidence/bootstrap/
            bundle/evidence/VERDICT.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
